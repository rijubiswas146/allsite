<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18182b"/>
      <stop offset="40%" stop-color="#0e0f1a"/>
      <stop offset="100%" stop-color="#08080f"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Link Ring 1 Gradient (Cyan to Blue) -->
    <linearGradient id="linkCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Link Ring 2 Gradient (Purple to Pink) -->
    <linearGradient id="linkPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="16" y="16" width="480" height="480" rx="124" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" filter="url(#softShadow)"/>

  <!-- Subtle Inner Radial Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)"/>

  <!-- Decorative Modern Nest Rings Background -->
  <ellipse cx="256" cy="256" rx="160" ry="110" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" stroke-dasharray="8 8" transform="rotate(-20 256 256)"/>
  <ellipse cx="256" cy="256" rx="145" ry="95" fill="none" stroke="rgba(56,189,248,0.12)" stroke-width="2" stroke-dasharray="12 6" transform="rotate(25 256 256)"/>

  <!-- LinkerNest Interlocking Links forming L and N -->
  <!-- Left Link Loop ("L" Anchor) -->
  <path d="M 175 160 C 135 160, 105 190, 105 230 L 105 285 C 105 325, 135 355, 175 355 L 210 355 C 250 355, 280 325, 280 285 L 280 270"
        fill="none"
        stroke="url(#linkCyan)"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glowFilter)"/>

  <!-- Right Link Loop ("N" Haven Loop) -->
  <path d="M 337 352 C 377 352, 407 322, 407 282 L 407 227 C 407 187, 377 157, 337 157 L 302 157 C 262 157, 232 187, 232 227 L 232 242"
        fill="none"
        stroke="url(#linkPurple)"
        stroke-width="36"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glowFilter)"/>

  <!-- Central Bridge Overlap (Interlaced Link Connection) -->
  <path d="M 195 240 L 317 272"
        fill="none"
        stroke="#ffffff"
        stroke-width="28"
        stroke-linecap="round"
        opacity="0.95"/>

  <path d="M 195 240 L 317 272"
        fill="none"
        stroke="url(#borderGrad)"
        stroke-width="20"
        stroke-linecap="round"/>

  <!-- Core Glowing Nodes / Sparkle -->
  <circle cx="175" cy="230" r="10" fill="#38bdf8"/>
  <circle cx="337" cy="282" r="10" fill="#ec4899"/>
  <circle cx="256" cy="256" r="7" fill="#ffffff" filter="url(#glowFilter)"/>

  <!-- Corner Mini Sparkles -->
  <path d="M 390 115 L 395 125 L 405 130 L 395 135 L 390 145 L 385 135 L 375 130 L 385 125 Z" fill="#38bdf8" opacity="0.8"/>
  <path d="M 120 375 L 123 382 L 130 385 L 123 388 L 120 395 L 117 388 L 110 385 L 117 382 Z" fill="#c084fc" opacity="0.7"/>
</svg>
